<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Services</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container-fluid">
        <!-- Header Section -->
        <div class="row bg-primary text-white p-2">
            <div class="col">
                <h4>SERVICES</h4>
            </div>
            <div class="col text-end">
                <button class="btn btn-danger btn-sm" onclick="back_to_previous_page()">Back</button>
            </div>
        </div>

        <!-- Patient Info Section -->
        <div class="row bg-light p-2">
            <div class="col-md-2">
                <strong>NAME: {{patient.name}}</strong>
            </div>
            <div class="col-md-2">
                <strong>DOB: {{patient.dob}}</strong>
            </div>
            <div class="col-md-2">
                <strong>UHID: {{patient.uhid}}</strong>
            </div>
            <div class="col-md-3">
                <strong>SEX / AGE: {{patient.sex}} / {{age}}</strong>
            </div>
            <div class="col-md-3">
                <strong>Sales Invoice: {{invoice}}</strong>
            </div>
        </div>

        <!-- Main Content Section -->
        <div class="row p-3">
            <!-- Service Category and Doctor Selection -->
            <div class="col-md-6">
                <div class="mb-3">
                    <label for="service-category" class="form-label">Choose a Service Category</label>
                    <select id="service-category" class="form-select">
                        <option selected>Choose a Service Category</option>
                        <!-- Add options here -->
                    </select>
                    <label for="item-search" class="form-label">Search by Item name</label>
                    <input type="text" id="item-search" class="form-control" placeholder="Search by item name...">
                </div>
                <div class="mb-3">
                    <label for="doctor" class="form-label">Choose a Doctor</label>
                    <select id="doctor" class="form-select">
                        <option></option>
                        <!-- Add more doctor options here -->
                    </select>
                </div>
            </div>

            <!-- Service List -->
            <div class="col-md-6">
                <label for="service-list" class="form-label">Service List</label>
                <select id="service-list" class="form-select" size="10">
                    <option>Select category</option>
                    <!-- Add more options here -->
                </select>
            </div>
        </div>

        <!-- Frequency, Duration, Units, Date -->
        <div class="row p-3">
            <div class="col-md-3">
                <div class="mb-3">
                    <label for="frequency" class="form-label">Frequency</label>
                    <select id="frequency" class="form-select">
                        <option selected>Once </option>
                        <!-- Add more frequency options here -->
                    </select>
                </div>
            </div>
            <div class="col-md-3">
                <div class="mb-3">
                    <label for="duration" class="form-label">Duration</label>
                    <select id="duration" class="form-select">
                        <option>One Time/Day</option>
                        <option>Two Days</option>
                        <option>Three Days</option>
                        <option>Four Days</option>
                        <!-- Add more duration options here -->
                    </select>
                </div>
            </div>
            <div class="col-md-3">
                <div class="mb-3">
                    <label for="units" class="form-label">Units</label>
                    <input type="number" id="units" class="form-control" value="1">
                </div>
            </div>
            <div class="col-md-3">
                <div class="mb-3">
                    <label for="date" class="form-label">Date</label>
                    <input type="date" id="date" class="form-control" >
                </div>
            </div>
        </div>
    </div>
</body>
</html>
