<div class="row layout-main">
    <div class="col layout-main-section-wrapper">
        <div class="layout-main-section">
            <div class="row user-profile">
                <div class="col-md-12">
                    <div class="performance-graphs">
                        <div class="frappe-card chart-column-container line-chart-container">
                            <div class="title-area py-3">
                                <h4 class="card-title">Goods Transfer 
                                </h4>
                                
                                <div class="queue-list-filter date-filter py-0">
                                       
                                </div>
                                <div class="queue-list-filter dept-filter py-0">
                                       
                                </div>
                                <span class="badge badge-pill badge-warning">
                                    {{status}}
                                </span>
                                
                            </div>
                            <div>
                                <button onclick="handleRequestItems(reqs)" class="btn btn-primary" id="request_items" style="background-color: yellow;color: black;float: right;display: none;">
                                    Request Items
                                </button>
                            </div>
                            <div class="list-row-container" tabindex="1">
                                <header class="level list-row-head text-muted">
                                    <div class="level-left list-header-subject">
                                            <div class="list-row-col ellipsis list-subject level  ">                                            
                                            <input class="level-item list-check-all hidden-xs" type="checkbox" name="select_all"
                                                title="Select All">
                                            <span  class="level-item"><strong>Item</strong></span>
                                        </div>
                                        <div class="list-row-col ellipsis hidden-xs  ">
                                            <span ><strong>Available Quantity</strong></span>
                                        </div>
                                        <div class="list-row-col ellipsis hidden-xs  ">
                                            <span ><strong>Branch</strong></span>
                                        </div>
                                        <div class="list-row-col ellipsis hidden-xs  ">
                                            <span ><strong>Warehouse</strong></span>
                                        </div>
                                        <div class="list-row-col ellipsis hidden-xs  ">
                                            <span ><strong>Status</strong></span>
                                        </div>
                                    </div>
                                    <div class="level-left checkbox-actions" style="display: none;">
                                        <div class="level list-subject">
                                            <input class="level-item list-check-all hidden-xs" type="checkbox"
                                                title="Select All">
                                            <span class="level-item list-header-meta"></span>
                                        </div>
                                    </div>
                                </header>
                                <div class="goods-transfer"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
